{% extends 'listings/base.html' %}
{% block title%} / delete band {% endblock %}

{% block content %}
    <h1> Suppression du groupe</h1>
    <p>Êtes-vous sûr de vouloir supprimer le groupe : <strong>{{band.name}}</strong></p>

    <form action="" method="post">
        {% csrf_token %}
        <input type="submit" value="Supprimer" style="background: red; padding: 3px 10px; color: #fff; border: 2px solid #ff0000; font-weight: bold;">
    </form>

{% endblock %}
